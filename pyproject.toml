[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "statslib-luna"
version = "0.1.0"
description = "A Python statistics library built from scratch"
requires-python = ">=3.12"

dependencies = [
    "frozendict; python_version < '3.15'"
]

[project.optional-dependencies]
test = ["pytest>=8"]
plot = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
