[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "statslib-luna"
version = "0.1.0"
description = "A Python statistics library built from scratch"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

dependencies = [
    "frozendict; python_version < '3.15'"
]
